name: Publish engine to GitHub Packages

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'engine/**'
      - 'gradle.properties'
      - 'gradle/libs.versions.toml'
      - 'gradle/wrapper/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'

concurrency:
  group: publish-engine-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish instagene-engine snapshot
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          # Tags are needed so the version can detect release tags on HEAD.
          fetch-depth: 0

      - name: Set up GraalVM 21
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: graalvm

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Enforce separation before publishing
        run: ./gradlew verifySeparation --console=plain

      - name: Publish to GitHub Packages
        run: ./gradlew :engine:publish --console=plain
        env:
          # The build script reads these for the GitHubPackages repository.
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
