name: Publish engine to GitHub Packages

on:
  workflow_dispatch:
  push:
    branches: [master]
    tags: ['v*']
    paths:
      - 'engine/**'
      - 'gradle.properties'
      - 'gradle/libs.versions.toml'
      - 'gradle/wrapper/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'

concurrency:
  group: publish-engine-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish instagene-engine
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          # Tags are needed so the version can detect release tags on HEAD.
          fetch-depth: 0

      - name: Set up GraalVM 21
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: graalvm

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Enforce separation before publishing
        run: ./gradlew verifySeparation --console=plain

      - name: Verify tagged release version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          expected="$(sed -n 's/^instagene.version=//p' gradle.properties)"
          test "$version" = "$expected" || {
            echo "Release tag $TAG does not match gradle.properties version $expected" >&2
            exit 1
          }

      - name: Publish to GitHub Packages
        run: ./gradlew :engine:publish --console=plain
        env:
          # The build script reads these for the GitHubPackages repository.
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
