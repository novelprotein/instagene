name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, for example v0.0.4
        required: true
        type: string

permissions:
  contents: write

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate tag and project version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "Release must use a semantic version tag like v0.0.4: $TAG" >&2
            exit 1
          }
          version="${TAG#v}"
          expected="$(sed -n 's/^instagene.version=//p' gradle.properties)"
          test "$version" = "$expected" || {
            echo "Release tag $TAG does not match gradle.properties version $expected" >&2
            exit 1
          }

  linux:
    name: Linux (deb, rpm, app-image, CLI dist)
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pkg: [DEB, RPM, APP_IMAGE]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up GraalVM 21
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: graalvm

      - name: Install rpm build tools
        if: ${{ matrix.pkg == 'RPM' }}
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run all checks
        run: ./gradlew build --console=plain

      - name: Build installer
        run: ./gradlew :app-gui:jpackage "-PjpackageType=${{ matrix.pkg }}" --console=plain

      - name: Upload installer
        if: ${{ matrix.pkg != 'APP_IMAGE' }}
        uses: actions/upload-artifact@v5
        with:
          name: linux-${{ matrix.pkg }}
          path: app-gui/build/jpackage/dist/*
          if-no-files-found: error

      - name: Build app-image zip fallback
        if: ${{ matrix.pkg == 'APP_IMAGE' }}
        run: ./gradlew :app-gui:jpackageAppImageZip "-PjpackageType=APP_IMAGE" --console=plain

      - name: Upload app-image zip
        if: ${{ matrix.pkg == 'APP_IMAGE' }}
        uses: actions/upload-artifact@v5
        with:
          name: linux-app-image-zip
          path: app-gui/build/jpackage/instagene-app-image.zip
          if-no-files-found: error

  gui-jar:
    name: Portable runnable GUI JAR
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up GraalVM 21
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: graalvm

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and verify runnable GUI JAR
        run: ./gradlew :app-gui:verifyStandaloneJar --console=plain

      - name: Smoke-test the GUI entry point
        shell: bash
        run: |
          set +e
          output=$(java -Djava.awt.headless=true -jar app-gui/build/distributions/instagene-gui.jar 2>&1)
          status=$?
          set -e
          test "$status" -eq 2
          grep -F "No display available" <<< "$output"

      - name: Upload runnable GUI JAR
        uses: actions/upload-artifact@v5
        with:
          name: instagene-gui-jar
          path: app-gui/build/distributions/instagene-gui.jar
          if-no-files-found: error

  linux-cli:
    name: Linux (CLI distribution zip)
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up GraalVM 21
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: graalvm

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build CLI distribution
        run: ./gradlew :app-cli:distZip --console=plain

      - name: Upload CLI distribution
        uses: actions/upload-artifact@v5
        with:
          name: cli-dist
          path: app-cli/build/distributions/instagene-cli.zip
          if-no-files-found: error

  native-cli:
    name: Native CLI image (GraalVM)
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up GraalVM 21
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: graalvm

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-home-cache-cleanup: true

      - name: Build native CLI image
        run: ./gradlew :app-cli:nativeCompile --no-configuration-cache --console=plain

      - name: Smoke-test native CLI
        shell: bash
        run: |
          set -euo pipefail
          binary=./app-cli/build/native/nativeCompile/instagene
          test -x "$binary"
          "$binary" --help >/tmp/instagene-native-help.txt
          "$binary" --version | grep -Fx 'InstaGene 0.0.4'

      - name: Upload native CLI image
        uses: actions/upload-artifact@v5
        with:
          name: native-cli-linux
          path: app-cli/build/native/nativeCompile/instagene
          if-no-files-found: error

  windows:
    name: Windows (.msi via WiX)
    needs: validate
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up GraalVM 21
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: graalvm

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build installer
        run: ./gradlew :app-gui:jpackage "-PjpackageType=MSI" --console=plain

      - name: Verify installed file association
        shell: pwsh
        run: |
          $msi = (Get-ChildItem app-gui/build/jpackage/dist/*.msi | Select-Object -First 1).FullName
          $log = Join-Path $env:RUNNER_TEMP "instagene-msi.log"
          $install = Start-Process msiexec.exe -ArgumentList "/i", $msi, "/qn", "/norestart", "/l*v", $log -Wait -PassThru
          if ($install.ExitCode -ne 0) { Get-Content $log; throw "MSI installation failed: $($install.ExitCode)" }
          $association = Get-ItemProperty "Registry::HKEY_CURRENT_USER\Software\Classes\.fa"
          if ([string]::IsNullOrWhiteSpace($association.'(default)')) { throw "FASTA association was not registered" }
          $uninstall = Start-Process msiexec.exe -ArgumentList "/x", $msi, "/qn", "/norestart" -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "MSI uninstall failed: $($uninstall.ExitCode)" }

      - name: Upload installer
        uses: actions/upload-artifact@v5
        with:
          name: windows-MSI
          path: app-gui/build/jpackage/dist/*
          if-no-files-found: error

  macos:
    name: macOS (.dmg)
    needs: validate
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up GraalVM 21
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: graalvm

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build installer
        run: ./gradlew :app-gui:jpackage "-PjpackageType=DMG" --console=plain --info --stacktrace

      - name: Smoke-test DMG
        shell: bash
        run: |
          set -euo pipefail
          dmg=$(ls app-gui/build/jpackage/dist/*.dmg | head -1)
          echo "Found DMG: $dmg"
          mount_point=$(mktemp -d /tmp/instagene-dmg.XXXXXX)
          mounted=0
          cleanup() {
            if [ "$mounted" -eq 1 ]; then hdiutil detach "$mount_point" -quiet || true; fi
            rm -rf "$mount_point"
          }
          trap cleanup EXIT
          hdiutil attach "$dmg" -mountpoint "$mount_point" -nobrowse -quiet
          mounted=1
          app="$mount_point/InstaGene.app"
          test -d "$app"
          test -f "$app/Contents/MacOS/InstaGene"
          plutil -extract CFBundleDocumentTypes xml1 -o /dev/null "$app/Contents/Info.plist"
          plutil -p "$app/Contents/Info.plist" > "$RUNNER_TEMP/instagene-info-plist.txt"
          grep -q 'fa' "$RUNNER_TEMP/instagene-info-plist.txt"

      - name: Upload installer
        uses: actions/upload-artifact@v5
        with:
          name: macos-DMG
          path: app-gui/build/jpackage/dist/*
          if-no-files-found: error

  engine-sources:
    name: Engine sources jar
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up GraalVM 21
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: graalvm

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build engine sources jar
        run: ./gradlew :engine:sourcesJar --console=plain

      - name: Upload sources jar
        uses: actions/upload-artifact@v5
        with:
          name: engine-sources
          path: engine/build/libs/engine-*-sources.jar
          if-no-files-found: error

  publish:
    name: Create GitHub Release
    needs: [validate, linux, linux-cli, native-cli, windows, macos, gui-jar, engine-sources]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: Compute checksums
        run: |
          cd artifacts
          sha256sum * > sha256sums.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "InstaGene $TAG" \
            --notes "Installers and distributions for InstaGene $TAG. See README.md for consumption of the \`instagene-engine\` library from GitHub Packages."
