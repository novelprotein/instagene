name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Linux native GUI packages
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - pkg: DEB
            task: :app-gui:nativeDeb
            artifact_name: linux-DEB
            artifact_path: app-gui/build/native-package/dist/*.deb
          - pkg: RPM
            task: :app-gui:nativeRpm
            artifact_name: linux-RPM
            artifact_path: app-gui/build/native-package/dist/*.rpm
          - pkg: APP_IMAGE
            task: :app-gui:nativeAppImageZip
            artifact_name: linux-native-app-image-zip
            artifact_path: app-gui/build/native-package/dist/instagene-native-app-image.zip
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up GraalVM 21
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          cache: gradle

      - name: Install rpm build tools
        if: ${{ matrix.pkg == 'RPM' }}
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run all checks
        run: ./gradlew build --console=plain

      - name: Build native package
        run: ./gradlew ${{ matrix.task }} --no-configuration-cache --console=plain

      - name: Upload native package
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  gui-jar:
    name: Portable runnable GUI JAR
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and verify runnable GUI JAR
        run: ./gradlew :app-gui:verifyStandaloneJar --console=plain

      - name: Smoke-test the GUI entry point
        shell: bash
        run: |
          set +e
          output=$(java -Djava.awt.headless=true -jar app-gui/build/distributions/instagene-gui.jar 2>&1)
          status=$?
          set -e
          test "$status" -eq 2
          grep -F "No display available" <<< "$output"

      - name: Upload runnable GUI JAR
        uses: actions/upload-artifact@v5
        with:
          name: instagene-gui-jar
          path: app-gui/build/distributions/instagene-gui.jar
          if-no-files-found: error

  native-cli:
    name: Native CLI image (GraalVM)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up GraalVM 21
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-home-cache-cleanup: true

      - name: Build native CLI image
        run: ./gradlew :app-cli:nativeCompile --no-configuration-cache --console=plain

      - name: Upload native CLI image
        uses: actions/upload-artifact@v5
        with:
          name: native-cli-linux
          path: app-cli/build/native/nativeCompile/instagene
          if-no-files-found: error

  windows:
    name: Windows native GUI MSI
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up GraalVM 21
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          cache: gradle

      - name: Install WiX
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build native installer
        run: ./gradlew :app-gui:nativeWindowsMsi --no-configuration-cache --console=plain

      - name: Upload installer
        uses: actions/upload-artifact@v5
        with:
          name: windows-MSI
          path: app-gui/build/native-package/dist/*.msi
          if-no-files-found: error

  macos:
    name: macOS native GUI DMG
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up GraalVM 21
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build native installer
        run: ./gradlew :app-gui:nativeMacDmg --no-configuration-cache --console=plain --info --stacktrace

      - name: Smoke-test DMG
        shell: bash
        run: |
          dmg=$(ls app-gui/build/native-package/dist/*.dmg | head -1)
          echo "Found DMG: $dmg"
          hdiutil attach "$dmg" -nobrowse -quiet
          mount_point=$(ls /Volumes/ | grep -i instagene | head -1)
          test -d "/Volumes/$mount_point/InstaGene.app"
          test -f "/Volumes/$mount_point/InstaGene.app/Contents/MacOS/InstaGene"
          hdiutil detach "/Volumes/$mount_point" -quiet

      - name: Upload installer
        uses: actions/upload-artifact@v5
        with:
          name: macos-DMG
          path: app-gui/build/native-package/dist/*.dmg
          if-no-files-found: error

  engine-sources:
    name: Engine sources jar
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 26
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build engine sources jar
        run: ./gradlew :engine:sourcesJar --console=plain

      - name: Upload sources jar
        uses: actions/upload-artifact@v5
        with:
          name: engine-sources
          path: engine/build/libs/engine-*-sources.jar
          if-no-files-found: error

  publish:
    name: Create GitHub Release
    needs: [linux, native-cli, windows, macos, gui-jar, engine-sources]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: Compute checksums
        run: |
          cd artifacts
          sha256sum * > sha256sums.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "InstaGene $TAG" \
            --notes "Installers and distributions for InstaGene $TAG. See README.md for consumption of the \`instagene-engine\` library from GitHub Packages."
