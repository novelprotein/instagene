name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Linux (deb, rpm, app-image, CLI dist)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pkg: [DEB, RPM, APP_IMAGE]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 26
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'

      - name: Install rpm build tools
        if: ${{ matrix.pkg == 'RPM' }}
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run all checks
        run: ./gradlew build --console=plain

      - name: Build installer
        run: ./gradlew :app-gui:jpackage "-PjpackageType=${{ matrix.pkg }}" --console=plain

      - name: Upload installer
        if: ${{ matrix.pkg != 'APP_IMAGE' }}
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.pkg }}
          path: app-gui/build/jpackage/dist/*
          if-no-files-found: error

      - name: Build app-image zip fallback
        if: ${{ matrix.pkg == 'APP_IMAGE' }}
        run: ./gradlew :app-gui:jpackageAppImageZip "-PjpackageType=APP_IMAGE" --console=plain

      - name: Upload app-image zip
        if: ${{ matrix.pkg == 'APP_IMAGE' }}
        uses: actions/upload-artifact@v4
        with:
          name: linux-app-image-zip
          path: app-gui/build/jpackage/instagene-app-image.zip
          if-no-files-found: error

  gui-jar:
    name: Portable runnable GUI JAR
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and verify runnable GUI JAR
        run: ./gradlew :app-gui:verifyStandaloneJar --console=plain

      - name: Smoke-test the GUI entry point
        shell: bash
        run: |
          set +e
          output=$(java -Djava.awt.headless=true -jar app-gui/build/distributions/instagene-gui.jar 2>&1)
          status=$?
          set -e
          test "$status" -eq 2
          grep -F "No display available" <<< "$output"

      - name: Upload runnable GUI JAR
        uses: actions/upload-artifact@v4
        with:
          name: instagene-gui-jar
          path: app-gui/build/distributions/instagene-gui.jar
          if-no-files-found: error

  linux-cli:
    name: Linux (CLI distribution zip)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 26
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build CLI distribution
        run: ./gradlew :app-cli:distZip --console=plain

      - name: Upload CLI distribution
        uses: actions/upload-artifact@v4
        with:
          name: cli-dist
          path: app-cli/build/distributions/instagene-cli.zip
          if-no-files-found: error

  windows:
    name: Windows (.msi via WiX)
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 26
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build installer
        run: ./gradlew :app-gui:jpackage "-PjpackageType=MSI" --console=plain

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-MSI
          path: app-gui/build/jpackage/dist/*
          if-no-files-found: error

  engine-sources:
    name: Engine sources jar
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 26
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build engine sources jar
        run: ./gradlew :engine:sourcesJar --console=plain

      - name: Upload sources jar
        uses: actions/upload-artifact@v4
        with:
          name: engine-sources
          path: engine/build/libs/engine-*-sources.jar
          if-no-files-found: error

  publish:
    name: Create GitHub Release
    needs: [linux, linux-cli, windows, gui-jar, engine-sources]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Compute checksums
        run: |
          cd artifacts
          sha256sum * > sha256sums.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "InstaGene $TAG" \
            --notes "Installers and distributions for InstaGene $TAG. See README.md for consumption of the \`instagene-engine\` library from GitHub Packages."
