name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build all modules and run the full test suite (JDK 26)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 26
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'

      - name: Set up Gradle
        # Caches the Gradle distribution, dependencies and build cache. Do not
        # add `cache: gradle` to setup-java as well - it conflicts with this.
        uses: gradle/actions/setup-gradle@v6

      - name: Build all modules and run all tests
        run: ./gradlew build --console=plain

      # Explicitly surface the separation checks (they are also part of `check`,
      # but fail fast here with a dedicated step name in the CI log).
      - name: Enforce engine/front-end separation
        run: ./gradlew verifySeparation --console=plain

      - name: Verify engine builds as a consumable library
        run: ./gradlew :engine:publishToMavenLocal --console=plain

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          if-no-files-found: ignore
          retention-days: 14

  portable-jar:
    name: Portable runnable GUI JAR
    if: ${{ github.event_name != 'pull_request' }}
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and verify runnable GUI JAR
        run: ./gradlew :app-gui:verifyStandaloneJar --console=plain

      - name: Smoke-test the GUI entry point
        shell: bash
        run: |
          set +e
          output=$(java -Djava.awt.headless=true -jar app-gui/build/distributions/instagene-gui.jar 2>&1)
          status=$?
          set -e
          test "$status" -eq 2
          grep -F "No display available" <<< "$output"

      - name: Upload runnable GUI JAR
        uses: actions/upload-artifact@v4
        with:
          name: instagene-gui-jar
          path: app-gui/build/distributions/instagene-gui.jar
          if-no-files-found: error
          retention-days: 14

  native-packages:
    name: ${{ matrix.label }}
    if: ${{ github.event_name != 'pull_request' }}
    needs: build-and-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux DEB
            os: ubuntu-latest
            package_type: DEB
            gradle_task: :app-gui:jpackage
            artifact_name: instagene-linux-deb
            artifact_path: app-gui/build/jpackage/dist/*.deb
          - label: Linux RPM
            os: ubuntu-latest
            package_type: RPM
            gradle_task: :app-gui:jpackage
            artifact_name: instagene-linux-rpm
            artifact_path: app-gui/build/jpackage/dist/*.rpm
          - label: Linux app image
            os: ubuntu-latest
            package_type: APP_IMAGE
            gradle_task: :app-gui:jpackageAppImageZip
            artifact_name: instagene-linux-app-image
            artifact_path: app-gui/build/jpackage/instagene-app-image.zip
          - label: Windows MSI
            os: windows-latest
            package_type: MSI
            gradle_task: :app-gui:jpackage
            artifact_name: instagene-windows-msi
            artifact_path: app-gui/build/jpackage/dist/*.msi
          - label: macOS DMG
            os: macos-15
            package_type: DMG
            gradle_task: :app-gui:macDmg
            artifact_name: instagene-macos-dmg
            artifact_path: app-gui/build/jpackage/dist/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install RPM build tools
        if: ${{ matrix.package_type == 'RPM' }}
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build native package
        if: ${{ matrix.package_type != 'DMG' }}
        run: ./gradlew ${{ matrix.gradle_task }} "-PjpackageType=${{ matrix.package_type }}" --console=plain

      - name: Build macOS DMG
        if: ${{ matrix.package_type == 'DMG' }}
        run: ./gradlew ${{ matrix.gradle_task }} --info --stacktrace --console=plain

      - name: Verify macOS DMG
        if: ${{ matrix.package_type == 'DMG' }}
        shell: bash
        run: |
          shopt -s nullglob
          dmg_files=(app-gui/build/jpackage/dist/*.dmg)
          test "${#dmg_files[@]}" -eq 1
          dmg="${dmg_files[0]}"
          hdiutil verify "$dmg"
          mount_point=$(mktemp -d)
          hdiutil attach -readonly -nobrowse -mountpoint "$mount_point" "$dmg"
          trap 'hdiutil detach "$mount_point" || true; rmdir "$mount_point" || true' EXIT
          test -d "$mount_point/InstaGene.app"
          test -x "$mount_point/InstaGene.app/Contents/MacOS/InstaGene"
          test -L "$mount_point/Applications"
          info_plist="$mount_point/InstaGene.app/Contents/Info.plist"
          marketing_version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$info_plist")
          bundle_version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$info_plist")
          expected_version=${dmg##*/InstaGene-}
          expected_version=${expected_version%.dmg}
          expected_bundle_version=$expected_version
          if [[ "$expected_bundle_version" == 0.* ]]; then
            expected_bundle_version="1.${expected_bundle_version#0.}"
          elif [[ "$expected_bundle_version" == 0 ]]; then
            expected_bundle_version=1
          fi
          test "$marketing_version" = "$expected_version"
          test "$bundle_version" = "$expected_bundle_version"
          [[ "$bundle_version" =~ ^[1-9][0-9]*(\.[0-9]+){0,2}$ ]]
          hdiutil detach "$mount_point"
          trap - EXIT
          rmdir "$mount_point"

      - name: Upload native package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 14
