name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.githooks/**'
      - 'scripts/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build all modules and run the full test suite (JDK 26)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 26
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'

      - name: Set up Gradle
        # Caches the Gradle distribution, dependencies and build cache. Do not
        # add `cache: gradle` to setup-java as well - it conflicts with this.
        uses: gradle/actions/setup-gradle@v6

      - name: Build all modules and run all tests
        run: ./gradlew build --console=plain

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          if-no-files-found: ignore
          retention-days: 14

  benchmark:
    name: Performance benchmark
    if: ${{ github.event_name != 'pull_request' }}
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run benchmarks
        run: ./gradlew :app-cli:bench --console=plain 2>&1 | tee bench-results.txt

      - name: Parse results to JSON
        run: |
          python3 - "$GITHUB_SHA" <<'PYEOF'
          import json, sys, re, datetime

          commit = sys.argv[1][:7]
          ts = datetime.datetime.now(datetime.timezone.utc).isoformat()
          results = []
          section = ""
          seq_name = ""
          seq_len = 0
          with open("bench-results.txt") as f:
              for line in f:
                  line = line.rstrip()
                  m = re.match(r"^--- (.+?) ---$", line)
                  if m:
                      section = m.group(1).replace(" ", "")
                      continue
                  m = re.match(r"^\s{2}(.+?)\s{2,}([\d.]+) ms$", line)
                  if m:
                      label = m.group(1)
                      ms = float(m.group(2))
                      results.append({"label": f"{section}/{label}", "ms": ms})
                  m = re.match(r"^== Benchmark: (.+?) \((\d+) (bp|aa)\) ==$", line)
                  if m:
                      seq_name, seq_len = m.group(1), int(m.group(2))

          data = {
              "commit": commit,
              "timestamp": ts,
              "sequence": seq_name,
              "length": seq_len,
              "results": results,
          }
          with open("bench-results.json", "w") as f:
              json.dump(data, f, indent=2)
          print(f"Parsed {len(results)} benchmarks for {seq_name} ({seq_len} bp)")
          PYEOF

      - name: Fetch previous baseline
        id: baseline
        continue-on-error: true
        run: |
          if gh api "repos/${{ github.repository }}/contents/benchmarks/latest.json" \
            --jq '.content' 2>/dev/null | tr -d '\n' | base64 --decode > baseline.json 2>/dev/null; then
            if [ -s baseline.json ] && python3 -c "import json; json.load(open('baseline.json'))" 2>/dev/null; then
              echo "found=true" >> "$GITHUB_OUTPUT"
              echo "Previous baseline found."
            else
              rm -f baseline.json
              echo "Baseline file invalid or empty."
            fi
          else
            echo "No previous baseline (first run or file not found)."
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Write comparison to job summary
        run: |
          python3 - "$GITHUB_STEP_SUMMARY" <<'PYEOF'
          import json, sys, os

          summary_path = sys.argv[1]
          with open("bench-results.json") as f:
              new = json.load(f)

          old = None
          if os.path.exists("baseline.json"):
              try:
                  with open("baseline.json") as f:
                      old = json.load(f)
              except (json.JSONDecodeError, ValueError):
                  old = None

          with open(summary_path, "w") as out:
              out.write(f"## Benchmark: {new['sequence']} ({new['length']} bp)\n\n")

              if old:
                  out.write(f"**{new['commit']}** vs previous **{old['commit']}**\n\n")

                  old_map = {r["label"]: r["ms"] for r in old["results"]}
                  new_map = {r["label"]: r["ms"] for r in new["results"]}
                  all_keys = sorted(set(old_map) | set(new_map))

                  out.write("| Benchmark | Old | New | Delta |\n")
                  out.write("|-----------|----:|----:|------:|\n")
                  regressions = []
                  for k in all_keys:
                      o = old_map.get(k)
                      n = new_map.get(k)
                      if o is None:
                          out.write(f"| `{k}` | -- | {n:.1f} ms | _new_ |\n")
                      elif n is None:
                          out.write(f"| `{k}` | {o:.1f} ms | -- | _removed_ |\n")
                      else:
                          pct = ((n - o) / o) * 100 if o else 0
                          sign = "+" if pct >= 0 else ""
                          flag = " :watch:" if pct > 15 else (" :zap:" if pct < -15 else "")
                          out.write(f"| `{k}` | {o:.1f} ms | {n:.1f} ms | {sign}{pct:.1f}%{flag} |\n")
                          if pct > 15:
                              regressions.append((k, o, n, pct))
                  if regressions:
                      out.write(f"\n> **{len(regressions)} regression(s)** (>15% slower):\n")
                      for k, o, n, p in regressions:
                          out.write(f"> - `{k}`: {o:.1f} -> {n:.1f} ms (+{p:.1f}%)\n")
              else:
                  out.write("_No previous baseline found. This is the first run._\n\n")
                  out.write("| Benchmark | Time |\n")
                  out.write("|-----------|-----:|\n")
                  for r in new["results"]:
                      out.write(f"| `{r['label']}` | {r['ms']:.1f} ms |\n")

              out.write(f"\n---\n_Run {new['commit']} at {new['timestamp'][:19]}Z_\n")
          print("Job summary written.")
          PYEOF

      - name: Upload benchmark results
        uses: actions/upload-artifact@v5
        with:
          name: benchmark-${{ github.sha }}
          path: bench-results.json
          retention-days: 90

      - name: Commit baseline and archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          export SHORT_SHA=$(git rev-parse --short HEAD)

          # --- Update benchmark-baseline branch (latest.json only) ---
          git fetch origin benchmark-baseline:benchmark-baseline 2>/dev/null || true
          if git rev-parse --verify benchmark-baseline >/dev/null 2>&1; then
            git checkout benchmark-baseline
          else
            git checkout --orphan benchmark-baseline
            git rm -rf . 2>/dev/null || true
          fi
          mkdir -p benchmarks
          cp bench-results.json benchmarks/latest.json
          git add benchmarks/latest.json
          git diff --cached --quiet || git commit -m "bench: $SHORT_SHA"
          git push origin benchmark-baseline

          # --- Update gh-pages branch (archive + manifest) ---
          git checkout ${{ github.sha }}
          git fetch origin gh-pages:gh-pages 2>/dev/null || true
          if git rev-parse --verify gh-pages >/dev/null 2>&1; then
            git checkout gh-pages
          else
            git checkout --orphan gh-pages
            git rm -rf . 2>/dev/null || true
          fi
          mkdir -p benchmarks/archive
          cp bench-results.json "benchmarks/archive/$SHORT_SHA.json"
          python3 - <<'PYEOF'
          import json, os
          manifest = "benchmarks/manifest.json"
          m = json.load(open(manifest)) if os.path.exists(manifest) else []
          m = [e for e in m if e["sha"] != os.environ["SHORT_SHA"]]
          with open("bench-results.json") as f:
              cur = json.load(f)
          m.append({"sha": os.environ["SHORT_SHA"], "ts": cur["timestamp"], "seq": cur["sequence"]})
          m.sort(key=lambda e: e["ts"])
          with open(manifest, "w") as f:
              json.dump(m, f, indent=2)
          PYEOF
          git add benchmarks/
          git diff --cached --quiet || git commit -m "bench archive: $SHORT_SHA"
          git push origin gh-pages

          git checkout ${{ github.sha }}

  portable-jar:
    name: Portable runnable GUI JAR
    if: ${{ github.event_name != 'pull_request' }}
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and verify runnable GUI JAR
        run: ./gradlew :app-gui:verifyStandaloneJar --console=plain

      - name: Smoke-test the GUI entry point
        shell: bash
        run: |
          set +e
          output=$(java -Djava.awt.headless=true -jar app-gui/build/distributions/instagene-gui.jar 2>&1)
          status=$?
          set -e
          test "$status" -eq 2
          grep -F "No display available" <<< "$output"

      - name: Upload runnable GUI JAR
        uses: actions/upload-artifact@v5
        with:
          name: instagene-gui-jar
          path: app-gui/build/distributions/instagene-gui.jar
          if-no-files-found: error
          retention-days: 14

  native-cli:
    name: Native CLI image (GraalVM)
    if: ${{ github.event_name != 'pull_request' }}
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up GraalVM 21
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-home-cache-cleanup: true

      - name: Build native CLI image
        run: ./gradlew :app-cli:nativeCompile --no-configuration-cache --console=plain

      - name: Smoke-test native CLI
        run: |
          ./app-cli/build/native/nativeCompile/instagene --help || true
          file ./app-cli/build/native/nativeCompile/instagene

      - name: Upload native CLI image
        uses: actions/upload-artifact@v5
        with:
          name: instagene-native-cli-linux
          path: app-cli/build/native/nativeCompile/instagene
          if-no-files-found: error
          retention-days: 14

  native-packages:
    name: ${{ matrix.label }}
    if: ${{ github.event_name != 'pull_request' }}
    needs: build-and-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux DEB
            os: ubuntu-latest
            package_type: DEB
            gradle_task: :app-gui:jpackage
            artifact_name: instagene-linux-deb
            artifact_path: app-gui/build/jpackage/dist/*.deb
          - label: Windows MSI
            os: windows-latest
            package_type: MSI
            gradle_task: :app-gui:jpackage
            artifact_name: instagene-windows-msi
            artifact_path: app-gui/build/jpackage/dist/*.msi
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build native package
        run: ./gradlew ${{ matrix.gradle_task }} "-PjpackageType=${{ matrix.package_type }}" --console=plain

      - name: Upload native package
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 14

  docs:
    name: Deploy MkDocs site
    if: ${{ github.event_name != 'pull_request' }}
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install MkDocs and dependencies
        run: pip install mkdocs-material

      - name: Deploy to GitHub Pages
        run: mkdocs gh-deploy --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
