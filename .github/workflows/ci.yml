name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.githooks/**'
      - 'scripts/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build all modules and run the full test suite (GraalVM 21)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up GraalVM 21
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: graalvm

      - name: Set up Gradle
        # Caches the Gradle distribution, dependencies and build cache.
        uses: gradle/actions/setup-gradle@v6

      - name: Build all modules and run all tests
        run: ./gradlew build --console=plain

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          if-no-files-found: ignore
          retention-days: 14

  benchmark:
    name: Performance benchmark
    if: ${{ github.event_name != 'pull_request' }}
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up GraalVM 21
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: graalvm

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run benchmarks
        run: ./gradlew :app-cli:bench :app-gui:desktopBench --console=plain 2>&1 | tee bench-results.txt

      - name: Parse results to JSON
        run: |
          python3 - "$GITHUB_SHA" <<'PYEOF'
          import json, sys, re, datetime

          commit = sys.argv[1][:7]
          ts = datetime.datetime.now(datetime.timezone.utc).isoformat()
          results = []
          section = ""
          seq_name = ""
          seq_len = 0
          with open("bench-results.txt") as f:
              for line in f:
                  line = line.rstrip()
                  m = re.match(r"^--- (.+?) ---$", line)
                  if m:
                      section = m.group(1).replace(" ", "")
                      continue
                  m = re.match(r"^\s{2}(.+?)\s{2,}([\d.]+) ms$", line)
                  if m:
                      label = m.group(1)
                      ms = float(m.group(2))
                      results.append({"label": f"{section}/{label}", "ms": ms})
                  m = re.match(r"^== Benchmark: (.+?) \((\d+) (bp|aa)\) ==$", line)
                  if m:
                      seq_name, seq_len = m.group(1), int(m.group(2))

          data = {
              "commit": commit,
              "timestamp": ts,
              "sequence": seq_name,
              "length": seq_len,
              "results": results,
          }
          with open("bench-results.json", "w") as f:
              json.dump(data, f, indent=2)
          print(f"Parsed {len(results)} benchmarks for {seq_name} ({seq_len} bp)")
          PYEOF

      - name: Fetch previous baseline
        id: baseline
        continue-on-error: true
        run: |
          if gh api "repos/${{ github.repository }}/contents/benchmarks/latest.json?ref=benchmark-baseline" \
            --jq '.content' 2>/dev/null | tr -d '\n' | base64 --decode > baseline.json 2>/dev/null; then
            if [ -s baseline.json ] && python3 -c "import json; json.load(open('baseline.json'))" 2>/dev/null; then
              echo "found=true" >> "$GITHUB_OUTPUT"
              echo "Previous baseline found."
            else
              rm -f baseline.json
              echo "Baseline file invalid or empty."
            fi
          else
            echo "No previous baseline (first run or file not found)."
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Write comparison to job summary
        run: |
          python3 - "$GITHUB_STEP_SUMMARY" <<'PYEOF'
          import json, sys, os

          summary_path = sys.argv[1]
          with open("bench-results.json") as f:
              new = json.load(f)

          old = None
          if os.path.exists("baseline.json"):
              try:
                  with open("baseline.json") as f:
                      old = json.load(f)
              except (json.JSONDecodeError, ValueError):
                  old = None

          with open(summary_path, "w") as out:
              out.write(f"## Benchmark: {new['sequence']} ({new['length']} bp)\n\n")

              if old:
                  out.write(f"**{new['commit']}** vs previous **{old['commit']}**\n\n")

                  old_map = {r["label"]: r["ms"] for r in old["results"]}
                  new_map = {r["label"]: r["ms"] for r in new["results"]}
                  all_keys = sorted(set(old_map) | set(new_map))

                  out.write("| Benchmark | Old | New | Delta |\n")
                  out.write("|-----------|----:|----:|------:|\n")
                  regressions = []
                  for k in all_keys:
                      o = old_map.get(k)
                      n = new_map.get(k)
                      if o is None:
                          out.write(f"| `{k}` | -- | {n:.1f} ms | _new_ |\n")
                      elif n is None:
                          out.write(f"| `{k}` | {o:.1f} ms | -- | _removed_ |\n")
                      else:
                          pct = ((n - o) / o) * 100 if o else 0
                          sign = "+" if pct >= 0 else ""
                          flag = " :watch:" if pct > 15 else (" :zap:" if pct < -15 else "")
                          out.write(f"| `{k}` | {o:.1f} ms | {n:.1f} ms | {sign}{pct:.1f}%{flag} |\n")
                          if pct > 15:
                              regressions.append((k, o, n, pct))
                  if regressions:
                      out.write(f"\n> **{len(regressions)} regression(s)** (>15% slower):\n")
                      for k, o, n, p in regressions:
                          out.write(f"> - `{k}`: {o:.1f} -> {n:.1f} ms (+{p:.1f}%)\n")
              else:
                  out.write("_No previous baseline found. This is the first run._\n\n")
                  out.write("| Benchmark | Time |\n")
                  out.write("|-----------|-----:|\n")
                  for r in new["results"]:
                      out.write(f"| `{r['label']}` | {r['ms']:.1f} ms |\n")

              out.write(f"\n---\n_Run {new['commit']} at {new['timestamp'][:19]}Z_\n")
          print("Job summary written.")
          PYEOF

      - name: Upload benchmark results
        uses: actions/upload-artifact@v5
        with:
          name: benchmark-${{ github.sha }}
          path: bench-results.json
          retention-days: 90

      - name: Commit baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          export SHORT_SHA=$(git rev-parse --short HEAD)

          # --- Update benchmark-baseline branch (latest.json only) ---
          git fetch origin benchmark-baseline:benchmark-baseline 2>/dev/null || true
          if git rev-parse --verify benchmark-baseline >/dev/null 2>&1; then
            git checkout benchmark-baseline
          else
            git checkout --orphan benchmark-baseline
            git rm -rf . 2>/dev/null || true
          fi
          mkdir -p benchmarks
          cp bench-results.json benchmarks/latest.json
          git add benchmarks/latest.json
          git diff --cached --quiet || git commit -m "bench: $SHORT_SHA"
          git push origin benchmark-baseline

          git checkout ${{ github.sha }}

  portable-jar:
    name: Portable runnable GUI JAR
    if: ${{ github.event_name != 'pull_request' }}
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up GraalVM 21
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: graalvm

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and verify runnable GUI JAR
        run: ./gradlew :app-gui:verifyStandaloneJar --console=plain

      - name: Smoke-test the GUI entry point
        shell: bash
        run: |
          set +e
          output=$(java -Djava.awt.headless=true -jar app-gui/build/distributions/instagene-gui.jar 2>&1)
          status=$?
          set -e
          test "$status" -eq 2
          grep -F "No display available" <<< "$output"

      - name: Upload runnable GUI JAR
        uses: actions/upload-artifact@v5
        with:
          name: instagene-gui-jar
          path: app-gui/build/distributions/instagene-gui.jar
          if-no-files-found: error
          retention-days: 14

  native-cli:
    name: Native CLI image (${{ matrix.label }})
    needs: build-and-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux
            os: ubuntu-latest
            binary: app-cli/build/native/nativeCompile/instagene
          - label: Windows
            os: windows-latest
            binary: app-cli/build/native/nativeCompile/instagene.exe
          - label: macOS
            os: macos-latest
            binary: app-cli/build/native/nativeCompile/instagene
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up GraalVM 21
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: graalvm

      - name: Install Linux native-image prerequisites
        if: ${{ runner.os == 'Linux' }}
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-home-cache-cleanup: true

      - name: Build native CLI image
        run: ./gradlew :app-cli:nativeCompile --no-configuration-cache --console=plain

      - name: Smoke-test native CLI (Linux/macOS)
        if: ${{ runner.os != 'Windows' }}
        run: |
          set -euo pipefail
          binary=./${{ matrix.binary }}
          test -x "$binary"
          "$binary" --help >/tmp/instagene-native-help.txt
          "$binary" --version | grep -F 'InstaGene 0.0.4'
          file "$binary"

      - name: Smoke-test native CLI (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $binary = "${{ matrix.binary }}"
          if (-not (Test-Path $binary)) { throw "Missing native CLI: $binary" }
          & $binary --help | Out-File "$env:RUNNER_TEMP/instagene-native-help.txt"
          if ($LASTEXITCODE -ne 0) { throw "Native --help failed: $LASTEXITCODE" }
          $version = & $binary --version
          if ($LASTEXITCODE -ne 0 -or $version -notmatch 'InstaGene 0\.0\.4') {
            throw "Unexpected native version: $version"
          }

      - name: Upload native CLI image
        uses: actions/upload-artifact@v5
        with:
          name: instagene-native-cli-${{ matrix.label }}
          path: ${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 14

  native-packages:
    name: ${{ matrix.label }}
    needs: build-and-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux DEB
            os: ubuntu-latest
            package_type: DEB
            gradle_task: :app-gui:jpackage
            artifact_name: instagene-linux-deb
            artifact_path: app-gui/build/jpackage/dist/*.deb
          - label: Windows MSI
            os: windows-latest
            package_type: MSI
            gradle_task: :app-gui:jpackage
            artifact_name: instagene-windows-msi
            artifact_path: app-gui/build/jpackage/dist/*.msi
          - label: macOS DMG
            os: macos-latest
            package_type: DMG
            gradle_task: :app-gui:jpackage
            artifact_name: instagene-macos-dmg
            artifact_path: app-gui/build/jpackage/dist/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up GraalVM 21
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: graalvm

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build desktop package
        run: ./gradlew ${{ matrix.gradle_task }} "-PjpackageType=${{ matrix.package_type }}" --console=plain --info --stacktrace

      - name: Smoke-test installer (headless)
        if: ${{ matrix.package_type == 'DMG' }}
        shell: bash
        run: |
          set -euo pipefail
          dmg=$(ls app-gui/build/jpackage/dist/*.dmg | head -1)
          echo "Found DMG: $dmg"
          mount_point=$(mktemp -d /tmp/instagene-dmg.XXXXXX)
          mounted=0
          cleanup() {
            if [ "$mounted" -eq 1 ]; then hdiutil detach "$mount_point" -quiet || true; fi
            rm -rf "$mount_point"
          }
          trap cleanup EXIT
          hdiutil attach "$dmg" -mountpoint "$mount_point" -nobrowse -quiet
          mounted=1
          app="$mount_point/InstaGene.app"
          test -d "$app" || { echo "Missing InstaGene.app in DMG"; exit 1; }
          test -f "$app/Contents/MacOS/InstaGene"
          test -n "$(find "$app/Contents/Resources" -maxdepth 1 -name '*.icns' -print -quit)" || {
            echo "Missing packaged macOS application icon"; exit 1;
          }
          plutil -extract CFBundleDocumentTypes xml1 -o /dev/null "$app/Contents/Info.plist"
          plutil -p "$app/Contents/Info.plist" > "$RUNNER_TEMP/instagene-info-plist.txt"
          grep -q 'fa' "$RUNNER_TEMP/instagene-info-plist.txt"
          echo "DMG smoke test passed"

      - name: Smoke-test installer (DEB)
        if: ${{ matrix.package_type == 'DEB' }}
        shell: bash
        run: |
          set -euo pipefail
          deb=$(ls app-gui/build/jpackage/dist/*.deb | head -1)
          echo "Found DEB: $deb"
          dpkg-deb -I "$deb" | grep -qi instagene
          inspect_dir=$(mktemp -d)
          trap 'rm -rf "$inspect_dir"' EXIT
          dpkg-deb -x "$deb" "$inspect_dir"
          test -x "$inspect_dir/usr/bin/instagene"
          test -f "$inspect_dir/opt/instagene/lib/instagene-InstaGene-MimeInfo.xml"
          grep -q 'text/x-fasta' "$inspect_dir/opt/instagene/lib/instagene-InstaGene-MimeInfo.xml"
          dpkg-deb -e "$deb" "$inspect_dir/control"
          grep -q 'xdg-mime install' "$inspect_dir/control/postinst"
          echo "DEB smoke test passed"

      - name: Smoke-test installer (MSI)
        if: ${{ matrix.package_type == 'MSI' }}
        shell: pwsh
        run: |
          $msi = (Get-ChildItem app-gui/build/jpackage/dist/*.msi | Select-Object -First 1).FullName
          Write-Host "Found MSI: $msi"
          $log = Join-Path $env:RUNNER_TEMP "instagene-msi.log"
          $install = Start-Process msiexec.exe -ArgumentList "/i", $msi, "/qn", "/norestart", "/l*v", $log -Wait -PassThru
          if ($install.ExitCode -ne 0) { Get-Content $log; throw "MSI installation failed: $($install.ExitCode)" }
          $uninstallKey = Get-ChildItem @(
            'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall',
            'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall'
          ) -ErrorAction SilentlyContinue |
            Get-ItemProperty -ErrorAction SilentlyContinue |
            Where-Object { $_.DisplayName -eq 'InstaGene' } |
            Select-Object -First 1
          if ($null -eq $uninstallKey -or [string]::IsNullOrWhiteSpace($uninstallKey.InstallLocation)) {
            throw "MSI did not register an InstaGene install location"
          }
          $executable = Join-Path $uninstallKey.InstallLocation 'InstaGene.exe'
          if (-not (Test-Path $executable)) { throw "Missing installed executable: $executable" }
          $shortcut = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\InstaGene\InstaGene.lnk'
          if (-not (Test-Path $shortcut)) { throw "Missing Start Menu shortcut: $shortcut" }
          $extensions = @('.fa', '.fasta', '.fna', '.fas', '.seq', '.gb', '.gbk', '.genbank', '.ape', '.gff', '.gff3', '.embl', '.ena', '.swiss', '.sprot', '.dat', '.aln', '.clustal', '.afa', '.msa', '.sto', '.stockholm', '.phy', '.phylip', '.ph')
          foreach ($extension in $extensions) {
            $association = Get-ItemProperty "Registry::HKEY_CURRENT_USER\Software\Classes\$extension" -ErrorAction SilentlyContinue
            if ($null -eq $association -or [string]::IsNullOrWhiteSpace($association.'(default)')) {
              throw "File association was not registered for $extension"
            }
            $openCommand = Get-ItemPropertyValue "Registry::HKEY_CURRENT_USER\Software\Classes\$($association.'(default)')\shell\open\command" -Name '(default)' -ErrorAction SilentlyContinue
            if ([string]::IsNullOrWhiteSpace($openCommand) -or $openCommand -notmatch 'InstaGene\.exe') {
              throw "File association for $extension has no InstaGene open command"
            }
          }
          $sample = Join-Path $env:RUNNER_TEMP 'instagene-association-smoke.fa'
          Set-Content -Path $sample -Value ">smoke`nACGT" -NoNewline
          Start-Process $sample
          Start-Sleep -Seconds 3
          $launched = Get-Process -Name 'InstaGene' -ErrorAction SilentlyContinue
          if ($null -eq $launched) { throw "Opening a FASTA file did not launch InstaGene" }
          $launched | Stop-Process -Force
          $uninstall = Start-Process msiexec.exe -ArgumentList "/x", $msi, "/qn", "/norestart" -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "MSI uninstall failed: $($uninstall.ExitCode)" }
          echo "MSI smoke test passed"

      - name: Upload desktop package
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 14

  docs-check:
    name: Validate MkDocs site
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install MkDocs and dependencies
        run: pip install -r docs/requirements.txt

      - name: Build documentation in strict mode
        run: ./scripts/check-docs.sh

      - name: Verify generated site is non-empty
        shell: bash
        run: |
          test -f site/index.html
          test "$(find site -type f | wc -l)" -gt 0

  docs:
    name: Deploy MkDocs site
    if: ${{ github.event_name != 'pull_request' }}
    needs: [build-and-test, benchmark, docs-check]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install MkDocs and dependencies
        run: pip install -r docs/requirements.txt

      - name: Build site
        run: ./scripts/check-docs.sh

      - name: Copy benchmark archive into site
        run: |
          git fetch origin benchmark-baseline:benchmark-baseline 2>/dev/null || true
          if git rev-parse --verify benchmark-baseline >/dev/null 2>&1; then
            mkdir -p site/benchmarks/archive
            # Copy latest.json as the current run's archive entry
            SHORT_SHA=$(git rev-parse --short origin/benchmark-baseline^{commit})
            cp <(git show origin/benchmark-baseline:benchmarks/latest.json) \
               "site/benchmarks/archive/$SHORT_SHA.json"
            # Rebuild manifest from gh-pages existing archive + this run
            python3 - <<'PYEOF'
          import json, os, subprocess, glob

          archive_dir = "site/benchmarks/archive"
          manifest = []

          # Try to read existing manifest from gh-pages
          try:
              existing = subprocess.check_output(
                  ["git", "show", "origin/gh-pages:benchmarks/manifest.json"],
                  stderr=subprocess.DEVNULL).decode()
              manifest = json.loads(existing)
          except Exception:
              manifest = []

          # Collect all archive JSON files in the directory
          seen_shas = set()
          for path in sorted(glob.glob(os.path.join(archive_dir, "*.json"))):
              with open(path) as f:
                  data = json.load(f)
              sha = data.get("commit", os.path.basename(path).replace(".json", ""))
              if sha not in seen_shas:
                  manifest.append({
                      "sha": sha,
                      "ts": data.get("timestamp", ""),
                      "seq": data.get("sequence", ""),
                  })
                  seen_shas.add(sha)

          manifest.sort(key=lambda e: e["ts"])
          with open(os.path.join(archive_dir, "..", "manifest.json"), "w") as f:
              json.dump(manifest, f, indent=2)
          print(f"Manifest rebuilt with {len(manifest)} entries.")
          PYEOF
          else
            echo "No benchmark baseline found, skipping archive merge."
          fi

      - name: Deploy to GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          deploy_site="$RUNNER_TEMP/mkdocs-site"
          rm -rf "$deploy_site"
          cp -a site "$deploy_site"
          git fetch origin gh-pages:gh-pages 2>/dev/null || true
          if git rev-parse --verify gh-pages >/dev/null 2>&1; then
            git checkout gh-pages
            # Preserve existing archive entries not yet in site/
            python3 - <<'PYEOF'
          import json, os, glob, subprocess

          deploy_site = os.environ["RUNNER_TEMP"] + "/mkdocs-site"
          archive_dir = os.path.join(deploy_site, "benchmarks/archive")
          os.makedirs(archive_dir, exist_ok=True)

          # Pull existing archive files from gh-pages
          try:
              files = subprocess.check_output(
                  ["git", "ls-tree", "--name-only", "gh-pages", "benchmarks/archive/"],
                  stderr=subprocess.DEVNULL).decode().strip().splitlines()
              for f in files:
                  fname = f.split("/")[-1]
                  dest = os.path.join(archive_dir, fname)
                  if not os.path.exists(dest):
                      content = subprocess.check_output(
                          ["git", "show", f"gh-pages:{f}"],
                          stderr=subprocess.DEVNULL)
                      with open(dest, "wb") as out:
                          out.write(content)
          except Exception:
              pass

          # Rebuild manifest from all archive files
          manifest = []
          seen = set()
          for path in sorted(glob.glob(os.path.join(archive_dir, "*.json"))):
              with open(path) as f:
                  data = json.load(f)
              sha = data.get("commit", os.path.basename(path).replace(".json", ""))
              if sha not in seen:
                  manifest.append({"sha": sha, "ts": data.get("timestamp", ""), "seq": data.get("sequence", "")})
                  seen.add(sha)
          manifest.sort(key=lambda e: e["ts"])
          with open(os.path.join(deploy_site, "benchmarks/manifest.json"), "w") as f:
              json.dump(manifest, f, indent=2)
          print(f"Final manifest: {len(manifest)} entries.")
          PYEOF
          else
            git checkout --orphan gh-pages
            git rm -rf . 2>/dev/null || true
          fi
          # Remove old files, copy new site, commit and push
          find . -maxdepth 1 ! -name '.' ! -name '.git' -exec rm -rf {} +
          # Copy directory contents, including any future hidden files. Using
          # `site/*` fails when the glob has no matches and caused an empty
          # generated site to abort deployment with cp: cannot stat.
          cp -a "$deploy_site"/. .
          git add -A
          git diff --cached --quiet || git commit -m "Deployed $(git rev-parse --short HEAD)"
          git push origin gh-pages --force
