name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build all modules and run the full test suite (JDK 26)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 26
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'

      - name: Set up Gradle
        # Caches the Gradle distribution, dependencies and build cache. Do not
        # add `cache: gradle` to setup-java as well - it conflicts with this.
        uses: gradle/actions/setup-gradle@v6

      - name: Build all modules and run all tests
        run: ./gradlew build --console=plain

      # Explicitly surface the separation checks (they are also part of `check`,
      # but fail fast here with a dedicated step name in the CI log).
      - name: Enforce engine/front-end separation
        run: ./gradlew verifySeparation --console=plain

      - name: Verify engine builds as a consumable library
        run: ./gradlew :engine:publishToMavenLocal --console=plain

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          if-no-files-found: ignore
          retention-days: 14
