site_name: InstaGene
site_description: A suite of tools for reading, editing, and constructing nucleic acid and protein sequences
site_url: https://novelprotein.github.io/instagene
repo_url: https://github.com/novelprotein/instagene
repo_name: novelprotein/instagene

theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - content.code.annotate
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - CLI Reference: cli.md
  - GUI Reference: gui.md
  - Engine API: engine-api.md
  - Benchmarks: benchmarks/index.md
  - Contributing: contributing.md
